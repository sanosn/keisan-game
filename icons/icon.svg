<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- アプリアイコンの元絵（ここから PNG を書き出す） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7CFF"/>
      <stop offset="1" stop-color="#8A5CFF"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="4" fill="#fff" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#dots)"/>
  <!-- 集中線 -->
  <g fill="#fff" opacity=".16" transform="translate(256 280)">
    <path d="M0 0 L-60 -400 L60 -400Z"/>
    <path d="M0 0 L-60 -400 L60 -400Z" transform="rotate(45)"/>
    <path d="M0 0 L-60 -400 L60 -400Z" transform="rotate(90)"/>
    <path d="M0 0 L-60 -400 L60 -400Z" transform="rotate(135)"/>
    <path d="M0 0 L-60 -400 L60 -400Z" transform="rotate(180)"/>
    <path d="M0 0 L-60 -400 L60 -400Z" transform="rotate(225)"/>
    <path d="M0 0 L-60 -400 L60 -400Z" transform="rotate(270)"/>
    <path d="M0 0 L-60 -400 L60 -400Z" transform="rotate(315)"/>
  </g>
  <!-- キャラクター（中央 80% の安全エリア内に収める） -->
  <g transform="translate(106 118) scale(2.5)">
    <ellipse cx="60" cy="118" rx="30" ry="5" fill="#000" opacity=".2"/>
    <line x1="60" y1="22" x2="60" y2="8" stroke="#2B2B45" stroke-width="4" stroke-linecap="round"/>
    <path d="M60 -2 l3.5 7 7.5 1 -5.5 5.2 1.3 7.6 -6.8 -3.6 -6.8 3.6 1.3 -7.6 -5.5 -5.2 7.5 -1z" fill="#FFC93C" stroke="#2B2B45" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="14" cy="44" rx="12" ry="7" fill="#FFB43C" stroke="#2B2B45" stroke-width="4" transform="rotate(45 14 44)"/>
    <ellipse cx="106" cy="44" rx="12" ry="7" fill="#FFB43C" stroke="#2B2B45" stroke-width="4" transform="rotate(-45 106 44)"/>
    <circle cx="60" cy="66" r="44" fill="#FFB43C" stroke="#2B2B45" stroke-width="4"/>
    <ellipse cx="46" cy="40" rx="12" ry="7" fill="#fff" opacity=".45" transform="rotate(-25 46 40)"/>
    <circle cx="32" cy="78" r="7" fill="#FF7FA0" opacity=".75"/>
    <circle cx="88" cy="78" r="7" fill="#FF7FA0" opacity=".75"/>
    <g fill="none" stroke="#2B2B45" stroke-width="4.5" stroke-linecap="round">
      <path d="M37 64 Q44 53 51 64"/><path d="M69 64 Q76 53 83 64"/>
    </g>
    <path d="M47 77 Q60 98 73 77 Z" fill="#8A2C3B" stroke="#2B2B45" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
