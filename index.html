<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- タブレットで拡大縮小されないようにする設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- ホーム画面に追加したとき、アプリのように全画面で開くための設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="けいさん">
  <meta name="theme-color" content="#5B7CFF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>けいさんパチパチ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="rays"></div>

  <div id="app">
    <!-- ===== スタート画面 ===== -->
    <section id="screen-title" class="screen active">
      <div class="title-head">
        <h1 class="logo" aria-label="けいさんパチパチ">
          <span class="logo-row"><i>け</i><i>い</i><i>さ</i><i>ん</i></span>
          <span class="logo-row"><i>パ</i><i>チ</i><i>パ</i><i>チ</i></span>
        </h1>
        <div class="mascot-wrap idle title-mascot"></div>
      </div>
      <div class="mode-switch">
        <button class="mode-btn" data-mode="ten">
          <span class="mode-name">10もん チャレンジ</span>
          <span class="mode-desc">10もんを はやく とこう</span>
        </button>
        <button class="mode-btn" data-mode="time">
          <span class="mode-name">3ぷん チャレンジ</span>
          <span class="mode-desc">3ぷんで なんもん とける？</span>
        </button>
      </div>
      <p class="lead">レベルを えらんでね</p>
      <div id="level-list"></div>
    </section>

    <!-- ===== ゲーム画面 ===== -->
    <section id="screen-game" class="screen">
      <header class="hud">
        <button id="btn-quit" class="hud-quit" aria-label="やめる">✕</button>
        <div class="hud-q" id="qno">1<small> / 10</small></div>
        <div class="hud-progress"><div id="progress-bar"></div></div>
        <div class="hud-timer">⏱ <span id="timer">0:00</span></div>
      </header>

      <div class="stage">
        <div class="play-area">
          <div id="game-mascot" class="mascot-wrap idle"></div>
          <div id="combo" class="combo"></div>
          <div id="card" class="card">
            <div class="level-name" id="level-name"></div>
            <div class="expr" id="expr-wrap">
              <span id="expr"></span><span class="eq" id="eq">=</span><span id="answer-boxes" class="boxes"></span>
            </div>
            <svg id="maru" class="maru" viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="50" r="40" />
            </svg>
            <div id="hint" class="hint"></div>
          </div>
        </div>

        <div id="pad" class="pad">
          <button class="key" data-key="7">7</button>
          <button class="key" data-key="8">8</button>
          <button class="key" data-key="9">9</button>
          <button class="key" data-key="4">4</button>
          <button class="key" data-key="5">5</button>
          <button class="key" data-key="6">6</button>
          <button class="key" data-key="1">1</button>
          <button class="key" data-key="2">2</button>
          <button class="key" data-key="3">3</button>
          <button class="key del" data-key="del">⌫<small>けす</small></button>
          <button class="key zero" data-key="0">0</button>
        </div>
      </div>
    </section>

    <!-- ===== けっか画面 ===== -->
    <section id="screen-result" class="screen">
      <div class="result-card">
        <h2 class="result-title">おわり！</h2>
        <div class="mascot-wrap result-mascot"></div>
        <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
        <div id="new-record" class="new-record">しんきろく！</div>
        <dl class="stats">
          <div><dt id="r-l1"></dt><dd id="r-v1"></dd></div>
          <div><dt id="r-l2"></dt><dd id="r-v2"></dd></div>
          <div><dt id="r-l3"></dt><dd id="r-v3"></dd></div>
          <div><dt id="r-l4"></dt><dd id="r-v4"></dd></div>
        </dl>
        <div class="result-buttons">
          <button id="btn-retry" class="big-btn retry">もういちど</button>
          <button id="btn-home" class="big-btn home">レベルを えらぶ</button>
        </div>
      </div>
    </section>
  </div>

  <div id="countdown" class="countdown"></div>
  <div id="praise" class="praise"></div>
  <div id="flash" class="flash"></div>
  <canvas id="fx"></canvas>

  <script src="game.js"></script>
  <script>
    // オフライン用の仕組みを登録（https か localhost のときだけ動く）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
